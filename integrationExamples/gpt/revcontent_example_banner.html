<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenAds.js Banner Example</title>
    <!-- OpenAds.js -->
    <!-- <script async src="openads.js"></script> -->
    <!-- <script async src="../../build/dist/openads.js"></script> -->
    <script async src="../../build/dev/openads.js"></script>
    <!-- Google Publisher Tag -->
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    <script>
        var oajs = oajs || {};
        oajs.que = oajs.que || [];
        const customConfigObject = {
            "buckets": [{
                "max": 40,
                "increment": 0.5
            }]
        };
        // OpenAds Banner Ad Unit
        const adUnits = [{
            code: '/21623266709/prebid-test',
            mediaTypes: {
                banner: {
                    sizes: [[300, 250]],
                }
            },
            bids: [{
                bidder: 'revcontent',
                params: {
                    // Your user-id and api-key
                    apiKey: 'abababababababababababababababababababab',
                    userId: 111111,
                    domain: 'www.denverpost.com',
                    endpoint: 'trends.revcontent.com',
                    bidfloor: 0.05,
                }
            }]
        },{
            code: '/21623266709/prebid-test-2',
            mediaTypes: {
                banner: {
                    sizes: [[300, 250]],
                }
            },
            bids: [{
                bidder: 'revcontent',
                params: {
                    // Your user-id and api-key
                    apiKey: 'abababababababababababababababababababab',
                    userId: 111111,
                    domain: 'www.denverpost.com',
                    endpoint: 'trends.revcontent.com',
                    bidfloor: 0.05,
                }
            }]
        }
        ];
    </script>
    <script>
        var googletag = googletag || {};
        googletag.cmd = googletag.cmd || [];
        googletag.cmd.push(function () {
            googletag.pubads().disableInitialLoad();
        });
        oajs.que.push(function () {
            oajs.setConfig({
                enableSendAllBids: false,
                priceGranularity: customConfigObject
            });
            oajs.addAdUnits(adUnits);
            oajs.requestBids({ bidsBackHandler: sendAdServerRequest });
        });
        function sendAdServerRequest() {
            googletag.cmd.push(function () {
                if (oajs.libLoaded) {
                    oajs.que.push(function () {
                        oajs.setTargetingForGPTAsync('/21623266709/prebid-test');
                        oajs.setTargetingForGPTAsync('/21623266709/prebid-test-2');
                        googletag.pubads().refresh();
                    });
                } else {
                    googletag.pubads().refresh();
                }
            });
        }
    </script>
    <script>
        googletag.cmd.push(function () {
            googletag
                .defineSlot('/21623266709/prebid-test', [[300, 250]], 'div-0')
                .addService(googletag.pubads());
            googletag
                .defineSlot('/21623266709/prebid-test-2', [[300, 250]], 'div-1')
                .addService(googletag.pubads());
            googletag.pubads().enableSingleRequest();
            googletag.enableServices();
        });
    </script>
</head>
<body>
    <h2>OpenAds.js Banner Example</h2>
    <div id='div-0'>
        <script>
            googletag.cmd.push(function () {
                googletag.display('div-0');
            });
        </script>
    </div>
    <br>
    <div id='div-1'>
        <script>
            googletag.cmd.push(function () {
                googletag.display('div-1');
            });
        </script>
    </div>
    <div id="targeting-keys"></div>
</body>
