<html>
    <head>
        <title>OpenAds.js Native Example</title>

        <script async src="../../build/dev/openads.js"></script>
        <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
        <script>
            /*
            Supported sizes:
            ----------------
            300x250 - Medium rectangle
            728x90 - Leaderboard
            300x600 - Half page or large skyscraper
            */
            var size = {width: 300, height: 250};

            var OAJS_TIMEOUT = 10000;
            var FAILSAFE_TIMEOUT = 30000;

            var adUnits = [{
                code: '/19968336/header-bid-tag-1',
                mediaTypes: {
                    native: {
                        image: {
                            required: false
                        },
                        title: {
                            required: false,
                            len: 140
                        },
                        clickUrl: {
                            required: false
                        },
                        sponsoredBy: {
                            id: 5,
                            name: 'data',
                            type: 1
                        }
                    }
                },
                bids: [{
                    bidder: 'revcontent',
                    params: {
                        size: size,
                        // Your user-id and api-key
                        apiKey: 'abababababababababababababababababababab',
                        userId: 111111,
                        domain: 'test.com',
                        endpoint: 'trends.revcontent.com'
                    }
                }]
            }];

            // ======== DO NOT EDIT BELOW THIS LINE =========== //
            var googletag = googletag || {};
            googletag.cmd = googletag.cmd || [];
            googletag.cmd.push(function() {
                googletag.pubads().disableInitialLoad();
            });

            var oajs = oajs || {};
            oajs.que = oajs.que || [];

            oajs.que.push(function() {
                oajs.addAdUnits(adUnits);
                oajs.requestBids({
                    bidsBackHandler: initAdserver,
                    timeout: OAJS_TIMEOUT
                });
            });

            function initAdserver() {
                if (oajs.initAdserverSet) return;
                oajs.initAdserverSet = true;
                googletag.cmd.push(function() {
                    if (oajs.libLoaded) {
                        oajs.setTargetingForGPTAsync && oajs.setTargetingForGPTAsync();
                        googletag.pubads().refresh();
                    } else {
                        googletag.pubads().refresh();
                    }
                });
            }
            
            // in case PBJS doesn't load
            setTimeout(function() {
                initAdserver();
            }, FAILSAFE_TIMEOUT);

            googletag.cmd.push(function() {
                googletag.defineSlot('/19968336/header-bid-tag-1', [[size.width, size.height]], 'div-1')
                	.addService(googletag.pubads());
                googletag.pubads().enableSingleRequest();
                googletag.enableServices();
            });

        </script>

    </head>

    <body>
        <h2>OpenAds.js Native Example</h2>
        <h5>Div-1</h5>
        <div id='div-1'>
            <script type='text/javascript'>
                googletag.cmd.push(function() {
                    googletag.display('div-1');
                });
            </script>
        </div>
    </body>

</html>
