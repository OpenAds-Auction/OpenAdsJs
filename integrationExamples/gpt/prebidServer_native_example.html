<html>

<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
  <script type="text/javascript" src="../../build/dev/openads.js" async></script>

  <script>
    var googletag = googletag || {};
    googletag.cmd = googletag.cmd || [];

    var oajs = oajs || {};
    oajs.que = oajs.que || [];
    var OAJS_TIMEOUT = 3000;

    var date = new Date().getTime();

function initAdserver() {
  if (oajs.initAdserverSet) return;

  googletag.cmd.push(function () {
    if (oajs.libLoaded) { // Check if OpenAds.js is loaded
      oajs.que.push(function () {
        oajs.setTargetingForGPTAsync();
        googletag.pubads().refresh();
      });
    } else {
      googletag.pubads().refresh();
    }
  });

  oajs.initAdserverSet = true;
}

    // Load GPT when timeout is reached.
    // setTimeout(initAdserver, OAJS_TIMEOUT);

    oajs.que.push(function () {

      oajs.setConfig({
        debug: true,
        userSync: {
          iframeEnabled: true
        }
      });

      var adUnits = [{
        code: '/19968336/prebid_native_example_1',
        // sizes: [[1, 1]],
        mediaTypes: {
          native: {
            title: {
              required: true,
              len: 800
            },
            image: {
              required: true,
              sizes: [989, 742],
            },
            sponsoredBy: {
              required: true
            }
          }
        },
        bids: [{
          bidder: 'appnexus',
          params: {
            placementId: 13232354,
            // placementId: 14141943,
            allowSmallerSizes: true
          }

        }]
      }, {
        code: '/19968336/prebid_native_example_2',
        // sizes: [[1, 1]],
        mediaTypes: {
          native: {
            title: {
              required: true,
              len: 800
            },
            body: {
              required: true
            },
            image: {
              required: true,
              sizes: [3000, 2250]
            },
            sponsoredBy: {
              required: true
            },
            icon: {
              required: false,
              sizes: [127, 83]
            },
          }
        },
        bids: [{
          bidder: 'appnexus',
          params: {
            placementId: 13232354,
            allowSmallerSizes: true
          }
        }]
      }];

      oajs.addAdUnits(adUnits);
      // oajs.bidderSettings = {
      //   appnexus: {
      //     bidCpmAdjustment: function () {
      //       return 10.00
      //     }
      //   }
      // };
      oajs.setConfig({
        s2sConfig: {
          accountId: '1',
          enabled: true, //default value set to false
          bidders: ['appnexuspsp'],
          timeout: 1000, //default value is 1000
          adapter: 'prebidServer', //if we have any other s2s adapter, default value is s2s
          endpoint: 'https://prebid.adnxs.com/pbs/v1/openrtb2/auction'
        }
      });
      oajs.requestBids({
        bidsBackHandler: function (bidResponses) {
          initAdserver();
        }
      });
    });

  </script>


  <script>
    // GPT setup
    googletag.cmd.push(function () {
      googletag.defineSlot('/19968336/prebid_native_example_1', [[360, 360]], 'div-1').addService(googletag.pubads());
      googletag.defineSlot('/19968336/prebid_native_example_2', 'fluid', 'div-2').addService(googletag.pubads());
      googletag.pubads().disableInitialLoad();
      googletag.pubads().enableSingleRequest();
      googletag.enableServices();
    });

  </script>
</head>

<body>

  <h2>OpenAds Native</h2>
  <div id='div-1'>
    <p>No response</p>
    <script type='text/javascript'>
      googletag.cmd.push(function () {
        googletag.display('div-1');
      });

    </script>
  </div>

  <br>
  <br>

  <div id='div-2'>
    <p>No response</p>
    <script type='text/javascript'>
      googletag.cmd.push(function () {
        googletag.display('div-2');
      });

    </script>
  </div>

</body>

</html>
