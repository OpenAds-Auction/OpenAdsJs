<html>
<head>
<script>
  var oajs = oajs || {};
  oajs.que = oajs.que || [];

  (function() {
    var oajsEl = document.createElement("script");
    oajsEl.type = "text/javascript";
    oajsEl.async = true;
    oajsEl.src = '../../build/dev/openads.js';
    var oajsTargetEl = document.getElementsByTagName("head")[0];
    oajsTargetEl.insertBefore(oajsEl, oajsTargetEl.firstChild);
  })();

  oajs.que.push(function() {
    var adUnits = [
      {
        code: 'regular_iframe',
        mediaTypes: {
          banner: {
            sizes: [[300, 250]]
          }
        },
        bids: [
          {
            bidder: 'appnexus',
            params: {
               placementId: 13144370
            }
          }
        ]
      },
      {
        code: 'large_iframe',
        mediaTypes: {
          banner: {
            sizes: [[970, 250]]
          }
        },
        bids: [
          {
            bidder: 'appnexus',
            params: {
               placementId: 13144370
            }
          }
        ]
      },
    ];

    oajs.setConfig({
      bidderTimeout: 1000,
      bidViewabilityIO: {
        enabled: true,
      }
    });

    oajs.onEvent('adRenderSucceeded', ({bid}) => {
      var p = document.createElement('p');
      p.innerHTML = bid.adUnitCode + ' was rendered';
      document.getElementById('notes').appendChild(p);
    });

    oajs.onEvent('bidViewable', (bid) => {
      var p = document.createElement('p');
      p.innerHTML = bid.adUnitCode + ' was viewed';
      document.getElementById('notes').appendChild(p);
    });

    oajs.addAdUnits(adUnits);

    oajs.requestBids({
      bidsBackHandler: function(bidResponses) {
        Object.keys(bidResponses).forEach(adUnitCode => {
          var highestCpmBids = oajs.getHighestCpmBids(adUnitCode);
          var winner = highestCpmBids.pop();
          var iframe = document.getElementById(adUnitCode);
          var iframeDoc = iframe.contentWindow.document;
          if (winner && winner.mediaType === 'banner') {
            oajs.renderAd(iframeDoc, winner.adId);
          } else if (winner) {
            iframe.width = 300;
            iframe.height = 300;
            iframeDoc.write('<head></head><body>unsupported mediaType</body>');
            iframeDoc.close();
          } else {
            iframe.width = 300;
            iframe.height = 300;
            iframeDoc.write('<head></head><body>no winner</body>');
            iframeDoc.close();
          }
        });
      }
    })
  });

</script>

</head>

<body>
    <div id="notes" style="position: fixed; right: 0; width: 50%; height: 100%;"></div>

    <div style="height: 100%"></div>

    <iframe id='regular_iframe'
            FRAMEBORDER="0"
            SCROLLING="no"
            MARGINHEIGHT="0"
            MARGINWIDTH="0"
            TOPMARGIN="0"
            LEFTMARGIN="0"
            ALLOWTRANSPARENCY="true"
            WIDTH="0"
            HEIGHT="0">
    </iframe>

    <div style="height: 100%"></div>

    <iframe id='large_iframe'
            FRAMEBORDER="0"
            SCROLLING="no"
            MARGINHEIGHT="0"
            MARGINWIDTH="0"
            TOPMARGIN="0"
            LEFTMARGIN="0"
            ALLOWTRANSPARENCY="true"
            WIDTH="0"
            HEIGHT="0">
    </iframe>

    <div style="height: 100%"></div>

</body>
</html>
