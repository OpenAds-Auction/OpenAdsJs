<html>
    <head>
        <title>OpenAds Test Bidder Example</title>
        <script src="../../build/dev/openads.js" async></script>
        <script>
            var oajs = oajs || {};
            oajs.que = oajs.que || [];

            const adUnitCode = 'adUnit-0000';

            const adUnits = [{
                mediaTypes: {
                    video: {
                        playerSize: [640, 360],
                        context: 'outstream'
                    }
                },
                code: adUnitCode,
                bids: [
                    {bidder: 'testBidder', params: {}}
                ]
            }]

            oajs.que.push(function () {

                /**
                 * BID RESPONSE SIMULATION SECTION START
                 *
                 * This section handles simulating a bidder
                 * that will always respond with bid responses.
                 *
                 * This part should not be present in production.
                 */
                oajs.registerBidAdapter(null, 'testBidder', {
                    supportedMediaTypes: ['banner', 'video', 'native'],
                    isBidRequestValid: () => true
                });

                oajs.setConfig({
                    debugging: {
                        enabled: true,
                        intercept: [
                            {
                                when: {
                                    bidder: 'testBidder',
                                },
                                then: {
                                    creativeId: 'testCreativeId',
                                }
                            }
                        ]
                    }
                });
                /**
                 * BID RESPONSE SIMULATION SECTION END
                 */

                oajs.addAdUnits(adUnits);
                oajs.requestBids({
                    adUnitCodes: [adUnitCode],
                    bidsBackHandler: function() {
                        const bids = oajs.getHighestCpmBids(adUnitCode);
                        const winningBid = bids[0];
                        oajs.renderAd(document, winningBid.adId);
                    }
                });
            });
        </script>
    </head>
    <body>
        <h2>OpenAds Test Bidder Example</h2>
        <h5>Video ad</h5>
        <div id="adUnit-0000"></div>
    </body>
</html>
